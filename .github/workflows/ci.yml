name: CI

on:
  pull_request:
    branches: [main]

# Least privilege: the jobs only read the code.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.sum
      - run: go vet ./...
      - run: go test ./...
      # Repository tests on a real PostgreSQL (testcontainers); ubuntu-latest has Docker.
      # -count=1 disables the test cache: TestMain reads the SQL migrations before
      # m.Run, where Go does not track files yet, so a migration-only change
      # could otherwise reuse an old "ok (cached)" result.
      - run: go test -count=1 -tags=integration ./internal/cards/...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit SHA, as the setup-uv docs recommend; uv reads .python-version from ai-service.
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          working-directory: ai-service
      # --locked fails the job if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
